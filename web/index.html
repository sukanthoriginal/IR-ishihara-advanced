<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>vOICe soundscape localization</title>
<style>
  html, body { height: 100%; margin: 0; }
  body {
    font-family: -apple-system, BlinkMacSystemFont, sans-serif;
    background: #111;
    color: #eee;
    display: flex;
    flex-direction: column;
    align-items: center;
    padding: 16px 20px;
    box-sizing: border-box;
  }
  h1 { font-size: 18px; font-weight: 500; color: #999; margin: 0 0 12px; flex: 0 0 auto; }
  .screen { max-width: 520px; text-align: center; }
  #trial-screen.screen {
    max-width: none;
    width: 100%;
    flex: 1 1 auto;
    min-height: 0;
    display: flex;
    flex-direction: column;
    align-items: center;
  }
  .hidden { display: none; }
  label { display: block; margin: 12px 0 4px; text-align: left; }
  input, select { font-size: 14px; padding: 6px; width: 100%; box-sizing: border-box; }
  button {
    margin-top: 20px;
    padding: 10px 24px;
    font-size: 15px;
    cursor: pointer;
    background: #4a9eff;
    border: none;
    border-radius: 4px;
    color: #fff;
  }
  button:disabled { background: #444; cursor: default; }
  #trial-status { margin-bottom: 12px; font-size: 14px; color: #aaa; min-height: 20px; flex: 0 0 auto; }
  #grid {
    position: relative;
    background: #222;
    border: 1px solid #555;
    cursor: crosshair;
    display: grid;
    margin: 0 auto;
    /* Fills all remaining space in #trial-screen (a column flexbox) at a
       16:10 shape. This is independent of the underlying 178x64 image aspect
       ratio -- click coords are scaled to image space per-axis in app.js, so
       the on-screen box shape doesn't need to match the image's native
       ratio. Letting flex-grow + aspect-ratio + max-width/max-height resolve
       the size means the browser computes the actual available space,
       instead of us hand-guessing viewport-minus-chrome pixel budgets. */
    flex: 1 1 auto;
    min-height: 0;
    aspect-ratio: 16 / 10;
    max-width: 100%;
    max-height: 100%;
  }
  .cell { border: 1px solid #333; }
  .flash {
    position: absolute;
    width: 14px;
    height: 14px;
    margin-left: -7px;
    margin-top: -7px;
    border-radius: 50%;
    pointer-events: none;
  }
  .flash.correct { background: rgba(80, 220, 100, 0.9); }
  .flash.incorrect { background: rgba(220, 80, 80, 0.9); }
  .target-marker {
    position: absolute;
    width: 16px;
    height: 16px;
    margin-left: -8px;
    margin-top: -8px;
    border: 2px solid rgba(255, 220, 60, 0.95);
    border-radius: 50%;
    pointer-events: none;
    box-sizing: border-box;
  }
  /* The visual-baseline stimulus itself (not feedback) -- deliberately much
     more obvious than .target-marker's muted feedback ring: this is the
     thing being localized, not an annotation on top of it.
     Width/height/margins are set per-trial in JS (they depend on the grid's
     on-screen size), so this only supplies shape/color/glow. The gradient
     uses "ellipse" (not "circle") so it stretches to match whatever
     width/height JS sets -- wider horizontally where the flash carries the
     column-blend blur, unblurred vertically. */
  .stimulus-flash {
    position: absolute;
    border-radius: 50%;
    background: radial-gradient(ellipse, #ffffff 0%, #a8ecff 45%, rgba(168,236,255,0) 75%);
    box-shadow: 0 0 28px 10px rgba(140, 225, 255, 0.85), 0 0 8px 3px #ffffff;
    pointer-events: none;
  }
  @media (prefers-reduced-motion: no-preference) {
    .stimulus-flash { animation: stimulus-pop 0.15s ease-out; }
  }
  @keyframes stimulus-pop {
    from { transform: scale(0.4); opacity: 0; }
    to { transform: scale(1); opacity: 1; }
  }
  /* Clicked once before every trial to guarantee a known, consistent cursor
     start position (a browser can't move the real OS cursor, so this is the
     enforced-behaviorally equivalent). Deliberately plain/neutral -- a
     control, not a stimulus, so it can't be confused with .stimulus-flash or
     .target-marker. */
  #recenter-marker {
    position: absolute;
    left: 50%;
    top: 50%;
    width: 36px;
    height: 36px;
    margin-left: -18px;
    margin-top: -18px;
    border-radius: 50%;
    border: 2px solid rgba(255, 255, 255, 0.85);
    cursor: pointer;
  }
  #recenter-marker::before, #recenter-marker::after {
    content: "";
    position: absolute;
    background: rgba(255, 255, 255, 0.85);
    top: 50%;
    left: 50%;
  }
  #recenter-marker::before { width: 2px; height: 16px; margin-left: -1px; margin-top: -8px; }
  #recenter-marker::after { width: 16px; height: 2px; margin-left: -8px; margin-top: -1px; }
  @media (prefers-reduced-motion: no-preference) {
    #recenter-marker { animation: recenter-pulse 1.4s ease-in-out infinite; }
  }
  @keyframes recenter-pulse {
    0%, 100% { transform: scale(1); opacity: 0.85; }
    50% { transform: scale(1.12); opacity: 1; }
  }
  #progress { margin-top: 10px; font-size: 13px; color: #777; flex: 0 0 auto; }
  #summary { text-align: left; font-size: 14px; line-height: 1.6; }
  #save-status { margin-top: 10px; font-size: 13px; color: #999; }
  #save-status.error { color: #e28080; }
</style>
</head>
<body>

<h1>vOICe soundscape localization task</h1>

<div id="setup-screen" class="screen">
  <p>Listen to each soundscape and click the grid cell you think the sound came from.</p>
  <label for="participant-id">Participant ID</label>
  <input id="participant-id" type="text" placeholder="e.g. your name" required>
  <label for="modality-select">Modality</label>
  <select id="modality-select">
    <option value="audio">Audio (vOICe)</option>
    <option value="visual">Visual (flash baseline)</option>
  </select>
  <div id="arm-field">
    <label for="arm">Arm</label>
    <select id="arm">
      <option value="novice">novice</option>
      <option value="supervised">supervised</option>
      <option value="self-supervised">self-supervised</option>
    </select>
  </div>
  <label for="grid-select">Grid</label>
  <select id="grid-select">
    <option value="3x3">3x3</option>
    <option value="4x3">4x3</option>
    <option value="16x9">16x9</option>
  </select>
  <label for="mode-select">Mode</label>
  <select id="mode-select">
    <option value="train">Train (feedback after every trial)</option>
    <option value="test">Test (no feedback until block ends)</option>
  </select>
  <label for="num-trials">Number of trials</label>
  <input id="num-trials" type="number" value="24" min="1">
  <br>
  <button id="start-btn">Start block</button>
</div>

<div id="trial-screen" class="screen hidden">
  <div id="trial-status">Loading...</div>
  <div id="grid"></div>
  <div id="progress"></div>
</div>

<div id="end-screen" class="screen hidden">
  <h2>Block complete</h2>
  <div id="summary"></div>
  <button id="retry-btn">Retry block</button>
  <button id="new-session-btn">New session</button>
  <button id="download-btn">Save results</button>
  <div id="save-status"></div>
</div>

<script src="app.js"></script>
</body>
</html>
